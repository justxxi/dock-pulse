version: '3.8'

services:
  dock-pulse:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dock-pulse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DOCK_PULSE_LISTEN_ADDR=:8080
      - DOCK_PULSE_LOG_LEVEL=info
      - DOCK_PULSE_SUPERVISOR=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
